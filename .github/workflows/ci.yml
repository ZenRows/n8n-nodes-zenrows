name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm install, not npm ci. @n8n/node-cli pulls @langchain/community,
      # which wants ignore@^7 while npm hoists ignore@5 and deduplicates the
      # two, so npm refuses its own tree. An overrides field would settle it,
      # but n8n forbids overrides in a community node package.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
