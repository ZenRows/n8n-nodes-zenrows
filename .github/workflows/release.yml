# Publishes n8n-nodes-zenrows to npm with a provenance statement.
#
# n8n stopped accepting locally published packages for verification on
# 2026-05-01, so this workflow is the only way the package may reach npm.
#
# `npm run release` is `n8n-node release`, which behaves differently in the two
# places it runs:
#   locally  - bumps the version, writes the changelog, commits, tags, pushes
#              and opens a GitHub release. It does NOT publish.
#   in CI    - detected through GITHUB_ACTIONS, runs lint and build and then
#              publishes with NPM_CONFIG_PROVENANCE=true.
# It is also the only thing that sets RELEASE_MODE, which the package's
# prepublishOnly guard requires, so a plain `npm publish` is refused by design.
#
# ─── FIRST PUBLISH ─────────────────────────────────────────────────────────
# A trusted publisher can only be configured against a package that already
# exists, so 0.1.0 goes up with a token:
#   1. On npmjs.com, create a granular access token scoped to the @zenrows
#      scope (not a package, which cannot be selected before it exists), with
#      read and write.
#   2. Add it to this repository as the NPM_TOKEN secret.
#   3. Publish a GitHub release for the version tag.
# Afterwards, configure Trusted Publishers on the package pointing at this
# workflow and delete the secret. npm is restricting 2FA-bypassing tokens for
# direct publishing from January 2027, so this token route is temporary.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required to mint the OIDC token that signs the provenance attestation.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Node 24 ships npm 11.x, but trusted publishing needs 11.5.1 or later
      # and the shipped patch version drifts. Without this a publish over OIDC
      # falls back to token auth and 401s.
      - run: npm install -g npm@^11.5.1
      # npm install, not npm ci. @n8n/node-cli pulls @langchain/community,
      # which wants ignore@^7 while npm hoists ignore@5 and deduplicates the
      # two, so npm refuses its own tree. An overrides field would settle it,
      # but n8n's scanner rejects overrides in a community node package.
      - run: npm install --no-audit --no-fund
      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME ($TAG) does not match package.json version $PKG"
            exit 1
          fi
      - run: npm test
      # Lint and build run inside `n8n-node release` as well; this publishes.
      # With NPM_TOKEN unset the OIDC exchange is used instead, which is where
      # this should end up once the package exists and has a trusted publisher.
      - name: Publish with provenance
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
